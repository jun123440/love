<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑车 · SVG</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:#F2EFE6;padding:24px;overflow:hidden;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8A7A64;
  }
  svg{width:min(96vw,980px);height:auto;display:block;
    filter:drop-shadow(0 18px 34px rgba(90,70,40,.16))}

  .wheel,.crank{transform-box:view-box;animation:spin 1.1s linear infinite}
  .rear-wheel{transform-origin:268px 342px}
  .front-wheel{transform-origin:618px 342px}
  .crank{transform-origin:392px 332px}

  #body{transform-box:view-box;transform-origin:356px 246px;
    animation:rock 1.1s ease-in-out infinite}
  #legA{transform-box:view-box;transform-origin:366px 248px;
    animation:legA 1.1s ease-in-out infinite}
  #legB{transform-box:view-box;transform-origin:352px 248px;
    animation:legB 1.1s ease-in-out infinite}

  .road{animation:slide 1.1s linear infinite}
  .puff{transform-box:fill-box;transform-origin:center;animation:puff 1.7s ease-out infinite}
  .puff.b{animation-delay:.5s}
  .puff.c{animation-delay:1s}
  .dash{animation:dash 1.1s linear infinite}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rock{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg)}}
  @keyframes legA{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
  @keyframes legB{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-6deg)}}
  @keyframes slide{to{transform:translateX(-150px)}}
  @keyframes dash{to{stroke-dashoffset:-66}}
  @keyframes puff{
    0%{transform:translate(0,0) scale(.3);opacity:0}
    20%{opacity:.8}
    100%{transform:translate(-46px,-26px) scale(1.3);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    #bike *{animation:none!important}
  }
</style>
</head>
