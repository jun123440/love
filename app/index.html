<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16121d">
<title>颜·值 · 今日风格卡</title>
<style>
*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:1rem;background:#16121d;color:#fce7ee;font:1rem/1.55 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 25% 10%,#6c325a80,transparent 65%),radial-gradient(ellipse at 90% 100%,#4d415180,transparent 55%)}
main{position:relative;width:min(100%,28rem);border:1px solid #dc91b45e;border-radius:1.6rem;padding:clamp(1.25rem,6vw,2.5rem);background:#201824;box-shadow:0 24px 60px #0008}
small{color:#f4b0cd;letter-spacing:.2em}h1{font-size:clamp(2.7rem,11vw,4.2rem);line-height:1;margin:.55rem 0}p{margin:.6rem 0 1.2rem;color:#e5cbd8}
#card{min-height:8rem;display:grid;align-content:center;gap:.35rem;border:1px solid #dc91b45e;border-radius:1rem;padding:1rem;margin:1.25rem 0;color:#fce7ee;background:#17111c}
#card strong{font-size:1.45rem}button{width:100%;min-height:3rem;border:0;border-radius:.8rem;background:#f4b0cd;color:#28141f;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#ffd4e5}a{display:inline-block;margin-top:1rem;color:#f4b0cd}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:4px}
</style>
</head>
<body>
<main>
<small>LOVE COLLECTION / STYLE CARD</small>
<h1>颜·值</h1>
<p>不打分，抽一张卡，为今天的自己换个风格。没有拍照，也没有上传。</p>
<div id="card" role="status" aria-atomic="true"><strong>今天是什么风格？</strong><span>轻触下方，揭晓你的卡片。</span></div>
<button id="draw" type="button">抽一张</button>
<a href="../">← 返回作品集</a>
</main>
<script>
const cards = [
 ['薄雾感','雾灰和蓝，像天刚亮的街道。'],
 ['暖调胶片','奶油色配一点焦糖，留住午后的光。'],
 ['夜行霓虹','黑色底色，加一小处荧光。'],
 ['静物日记','低饱和色，配一件有纹理的单品。'],
 ['柑橘晴天','给平常的一套加一抹橘色。'],
 ['蓝色时刻','靛蓝、银饰，还有傍晚的风。']
];
let last = -1;
document.querySelector('#draw').addEventListener('click', (event) => {
 const count = cards.length;
 const sample = Math.floor(Math.random() * (last === -1 ? count : count - 1));
 last = last !== -1 && sample >= last ? sample + 1 : sample;
 const [title, note] = cards[last];
 document.querySelector('#card strong').textContent = title;
 document.querySelector('#card span').textContent = note;
 event.currentTarget.textContent = '换一张';
});
</script>
</body>
</html>
