<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>粒子场 · 手势粒子</title>
<meta name="description" content="用摄像头手势驱动的 WebGL 粒子场。0-5 手势生成五种万花筒写轮眼，0 为大筒木白眼。全程本机推理。">
<meta name="theme-color" content="#04060e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23070303'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e0503f' stroke-opacity='.85' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ff8a7a'/%3E%3Ccircle cx='16' cy='7' r='1.5' fill='%23e0503f'/%3E%3Ccircle cx='24.2' cy='20' r='1.2' fill='%23e0503f' fill-opacity='.7'/%3E%3Ccircle cx='7.8' cy='20' r='1.2' fill='%23e0503f' fill-opacity='.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>

<canvas id="stage"></canvas>

<div id="gate">
  <div class="gate-card">
    <p class="eyebrow">PARTICLE&nbsp;FIELD</p>
    <h1>手势粒子场</h1>
    <p class="lede">张拳成旋，伸指成阵。<br>五指之内，皆有形。</p>

    <button id="enter" class="btn" type="button">
      <span>开启摄像头</span>
    </button>
    <button id="enter-demo" class="btn-ghost" type="button">没有摄像头？先看演示</button>

    <div id="progress" class="progress" aria-live="polite" hidden>
      <div class="bar"><i id="bar-fill"></i></div>
      <div class="stage-line">
        <span id="stage-text">准备中</span>
        <span id="stage-pct" class="mono">0%</span>
      </div>
    </div>

    <p id="gate-err" class="err" hidden></p>

    <ul class="legend" id="legend">
      <li><b>0</b><span>大筒木白眼</span></li>
      <li><b>1</b><span>三勾玉</span></li>
      <li><b>2</b><span>万花筒</span></li>
      <li><b>3</b><span>四叶瞳</span></li>
      <li><b>4</b><span>螺旋瞳</span></li>
      <li><b>5</b><span>终焉瞳</span></li>
    </ul>

    <p class="fineprint">推理全部在本机完成，画面不会离开这台设备。<br>建议使用最新版 Chrome / Edge。</p>
  </div>
</div>

<div id="hud" hidden>
  <div id="readout" class="readout">
    <span class="ro-glyph" id="ro-glyph"></span>
    <span class="ro-name" id="ro-name"></span>
  </div>

  <div id="status" class="status">
    <i class="dot" id="st-dot"></i><span id="st-text">待机</span>
  </div>

  <div id="panel" class="panel">
    <button class="mini" id="btn-debug" type="button" title="调试数据 (D)">数据</button>
    <button class="mini" id="btn-cam" type="button" title="摄像头预览 (C)">画面</button>
    <button class="mini" id="btn-stop" type="button" title="停止并返回 (Esc)">停止</button>
  </div>

  <pre id="stats" class="stats mono" hidden></pre>

  <div id="preview" class="preview" hidden>
    <video id="video" autoplay playsinline muted></video>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js?v=4"></script>
</body>
</html>
