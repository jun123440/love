<!doctype html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EVA初号机暴走</title>
	<link rel="manifest" href="manifest.json">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	<link rel="stylesheet" type="text/css" href="css/normalize.css" />
	<link rel="stylesheet" type="text/css" href="css/default.css">
	<link rel="stylesheet" type="text/css" href="css/styles.css">
	<style>
		body { touch-action: none; overflow:hidden; }
		#scene { position:absolute;inset:-8%;width:auto;height:auto;overflow:visible;transform:none;list-style:none; }
		#scene .layer { position:absolute;inset:0;width:100%;height:100%;margin:0; }
		#mode-switch:focus-visible { outline:2px solid #fff;outline-offset:4px; }
		#mode-switch {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 999;
			background: rgba(0,0,0,0.6);
			color: #fff;
			border: 1px solid rgba(255,255,255,0.3);
			min-height: 44px;
			padding: 8px 20px;
			border-radius: 20px;
			font-size: 14px;
			cursor: pointer;
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			user-select: none;
			transition: background 0.3s;
		}
		#mode-switch:hover { background: rgba(0,0,0,0.8); }
		#mode-label {
			position: fixed;
			top: 20px;
			right: 20px;
			z-index: 999;
			color: rgba(255,255,255,0.4);
			font-size: 12px;
			font-family: Arial, sans-serif;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<main>
      <div id="overlay"></div>
      <ul id="scene">
      <li class="layer" data-depth="0.2">
          <div class="layer0"></div>
        </li>
        <li class="layer" data-depth="0.4">
          <div class="layer1"></div>
        </li>
        <li class="layer" data-depth="0.6">
          <div class="layer2"></div>
        </li>
		<li class="layer" data-depth="0.8">
          <div class="layer3"></div>
        </li>
		<li class="layer" data-depth="0.9">
          <div class="layer4"></div>
        </li>
      </ul>
	</main>

	<div id="mode-label" role="status">触控</div>
 <button id="mode-switch" type="button" hidden>切换为陀螺仪控制</button>
 <script>
 (() => {
   const status = document.getElementById('mode-label');
   const button = document.getElementById('mode-switch');
   const layers = [...document.querySelectorAll('#scene .layer')];
   const reduce = matchMedia('(prefers-reduced-motion: reduce)');
   let mode = 'pointer', frame = 0, x = 0, y = 0;
   function paint() {
     frame = 0;
     const dx = reduce.matches ? 0 : x, dy = reduce.matches ? 0 : y;
     for (const layer of layers) {
       const depth = Number(layer.dataset.depth);
       layer.style.transform = 'translate3d(' + (-dx * depth * 24) + 'px,' + (-dy * depth * 24) + 'px,0)';
     }
   }
   function move(nextX, nextY) {
     x = nextX; y = nextY;
     if (!frame) frame = requestAnimationFrame(paint);
   }
   window.addEventListener('pointermove', e => {
     if (mode === 'pointer' && !reduce.matches) move(2 * e.clientX / innerWidth - 1, 2 * e.clientY / innerHeight - 1);
   }, { passive:true });
   document.addEventListener('pointerleave', () => { if (mode === 'pointer') move(0,0); });
   reduce.addEventListener('change', () => move(0,0));
   const clamp = n => Math.min(1,Math.max(-1,n));
   function orient(e) {
     if (mode === 'gyro' && e.beta != null && e.gamma != null && !reduce.matches) move(clamp(e.gamma/45),clamp(e.beta/45));
   }
   button.hidden = !('DeviceOrientationEvent' in window) || !matchMedia('(pointer: coarse)').matches;
   button.addEventListener('click', async () => {
     button.disabled = true;
     try {
       if (mode === 'gyro') {
         window.removeEventListener('deviceorientation', orient);
         mode = 'pointer';
         status.textContent = '触控';
         button.textContent = '切换为陀螺仪控制';
         move(0,0);
       } else {
         const request = DeviceOrientationEvent.requestPermission;
         if (request && await request.call(DeviceOrientationEvent) !== 'granted') {
           status.textContent = '未开启陀螺仪，仍可触控';
           return;
         }
         mode = 'gyro';
         window.addEventListener('deviceorientation',orient);
         status.textContent = '陀螺仪';
         button.textContent = '切换为触控';
       }
     } catch { status.textContent = '陀螺仪不可用，仍可触控'; }
     finally { button.disabled = false; }
   });
   if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
 })();
 </script>
</body>
</html>
