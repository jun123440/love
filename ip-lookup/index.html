<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 定位查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e27;color:#e0e0e0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:40px 20px 60px}
h1{text-align:center;font-size:1.8em;margin-bottom:8px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:.9em}
.search-box{display:flex;gap:10px;margin-bottom:24px}
.search-box input{flex:1;padding:14px 20px;border:1px solid #2a2f5a;border-radius:12px;background:#12163a;color:#fff;font-size:16px;outline:none;-webkit-appearance:none}
.search-box input:focus{border-color:#667eea}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;-webkit-appearance:none}
.btn:active{transform:scale(.97)}
.loading{text-align:center;padding:30px;color:#667eea;display:none}
.loading.show{display:block}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid #2a2f5a;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-card{background:#12163a;border:1px solid #2a2f5a;border-radius:16px;padding:24px;margin-bottom:20px;display:none}
.result-card.show{display:block;animation:fadeIn .4s ease}
.ip-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1e2355;flex-wrap:wrap}
.ip-header .ip{font-size:1.5em;font-weight:700;color:#667eea;font-family:'Courier New',monospace;word-break:break-all}
.flag{font-size:2em}
.speed-badge{padding:2px 10px;border-radius:10px;font-size:.75em;background:#1a3a1a;color:#4ade80}
.type-badge{padding:2px 10px;border-radius:10px;font-size:.75em;background:#1a1f4a;color:#8888cc}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.info-item{background:#0d1030;border-radius:10px;padding:14px 16px}
.info-item .label{font-size:.75em;color:#667eea;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.info-item .value{font-size:1.05em;word-break:break-all}
.info-item.hl .value{color:#4ade80;font-weight:600}
.source-line{margin-top:16px;font-size:.8em;color:#666}
.error-card{background:#1a0a0a;border:1px solid #4a1a1a;border-radius:16px;padding:24px;text-align:center;color:#ff6b6b;display:none}
.error-card.show{display:block}
.log-section{margin-top:24px;background:#12163a;border:1px solid #2a2f5a;border-radius:16px;padding:24px}
.log-section h3{color:#667eea;margin-bottom:12px;font-size:1em}
.log-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85em;min-width:340px}
th{text-align:left;padding:8px 10px;border-bottom:2px solid #2a2f5a;color:#667eea;font-size:.75em;text-transform:uppercase;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1a1f4a;font-family:'Courier New',monospace;white-space:nowrap}
.clear-btn{background:none;border:1px solid #2a2f5a;color:#888;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:.75em;float:right}
@media(prefers-reduced-motion:reduce){.spinner,.result-card.show{animation:none}}
@media(max-width:600px){.search-box{flex-direction:column}.container{padding:20px 14px 40px}h1{font-size:1.4em}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🌐 IP 定位查询</h1>
<p class="subtitle">输入 IPv4 或 IPv6；留空即可查询本机公网 IP。结果为近似归属地，提交时会访问第三方查询服务。</p>
<form class="search-box" id="query-form">
<input type="text" id="ipInput" aria-label="IP 地址" maxlength="45" autocomplete="off" spellcheck="false" placeholder="例如 8.8.8.8，或留空查询本机">
<button class="btn" type="submit">查 询</button>
</form>
<div class="loading" id="loading" role="status"><div class="spinner" aria-hidden="true"></div><div id="loadingText">正在检测你的 IP...</div></div>
<div class="result-card" id="resultCard">
<div class="ip-header">
<span class="flag" id="flag"></span>
<span class="ip" id="displayIp"></span>
<span class="type-badge" id="typeBadge"></span>
<span class="speed-badge" id="speedBadge"></span>
</div>
<div class="info-grid" id="infoGrid"></div>
<div class="source-line" id="sourceLine"></div>
</div>
<div class="error-card" id="errorCard" role="alert"></div>
<div class="log-section" id="logSection" style="display:none">
<h3>📋 检测记录 <button class="clear-btn" type="button" id="clearLog">清空</button></h3>
<div class="log-wrap">
<table><thead><tr><th>IP</th><th>位置</th><th>运营商</th><th>时间</th></tr></thead><tbody id="logBody"></tbody></table>
</div>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
const historyKey = 'iplog2';
let active, history = [];
try {
  const stored = JSON.parse(localStorage.getItem(historyKey));
  if (Array.isArray(stored)) history = stored.filter(row => row && typeof row.ip === 'string').slice(0,15);
} catch {}
const ipv4 = text => {
  const parts = text.split('.');
  return parts.length === 4 && parts.every(p => /^(0|[1-9][0-9]{0,2})$/.test(p) && Number(p) <= 255);
};
function validIp(text) {
  if (!text.includes(':')) return ipv4(text);
  if (!/^[0-9a-f:.]+$/i.test(text)) return false;
  if (text.includes('.')) {
    const split = text.lastIndexOf(':');
    if (!ipv4(text.slice(split + 1))) return false;
    text = text.slice(0, split + 1) + '0:0';
  }
  try { return new URL('http://[' + text + ']/').hostname.startsWith('['); }
  catch { return false; }
}
async function getJson(url, request) {
  const response = await fetch(url, {
    signal: AbortSignal.any([request.signal, AbortSignal.timeout(5500)]),
    credentials: 'omit', referrerPolicy: 'no-referrer'
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return response.json();
}
const providers = [
  ['vore.top', async (ip, request) => {
    const raw = await getJson('https://api.vore.top/api/IPdata' + (ip ? '?ip=' + encodeURIComponent(ip) : ''), request);
    if (raw.code !== 200 || !raw.ipdata || !raw.ipinfo?.text) throw new Error('空响应');
    const { ipinfo: info, ipdata: data } = raw;
    return {ip:info.text,type:info.type,country:info.cnip?'中国':data.info1,code:info.cnip?'CN':'',region:info.cnip?data.info1:data.info2,city:info.cnip?data.info2:data.info3,isp:data.isp,full:raw.adcode?.o};
  }],
  ['ipwho.is', async (ip, request) => {
    const data = await getJson('https://ipwho.is/' + encodeURIComponent(ip), request);
    if (!data.success || !data.ip) throw new Error('空响应');
    return {ip:data.ip,type:data.type,country:data.country,code:data.country_code,region:data.region,city:data.city,isp:data.connection?.isp,lat:data.latitude,lng:data.longitude};
  }]
];
function showError(text) {
  $('errorCard').textContent = text;
  $('errorCard').classList.add('show');
}
function renderHistory() {
  $('logSection').style.display = history.length ? '' : 'none';
  $('logBody').replaceChildren(...history.map(row => {
    const el = document.createElement('tr');
    for (const key of ['ip','place','isp','time']) el.insertCell().textContent = row[key] ?? '—';
    return el;
  }));
}
function showResult(data, source, ms) {
  $('displayIp').textContent = data.ip;
  const code = String(data.code).toUpperCase();
  $('flag').textContent = /^[A-Z]{2}$/.test(code) ? String.fromCodePoint(...Array.from(code, c => c.charCodeAt(0) + 127397)) : '🌍';
  $('typeBadge').textContent = String(data.type || '').toUpperCase();
  $('speedBadge').textContent = ms + ' ms';
  const coords = Number.isFinite(data.lat) && Number.isFinite(data.lng) ? [data.lat,data.lng].map(v => v.toFixed(4)).join(', ') : '';
  const fields = [['国家/地区',data.country],['省份',data.region],['城市',data.city],['运营商',data.isp],['完整归属',data.full],['经纬度',coords]];
  $('infoGrid').replaceChildren(...fields.map(([label,value], i) => {
    const item = document.createElement('div');
    item.className = i < 3 ? 'info-item hl' : 'info-item';
    const name = document.createElement('div'), result = document.createElement('div');
    name.className = 'label'; name.textContent = label;
    result.className = 'value'; result.textContent = value || '—';
    item.append(name,result);
    return item;
  }));
  $('sourceLine').textContent = '数据来源：' + source;
  $('resultCard').classList.add('show');
  history = [{ip:data.ip,place:[data.region,data.city].filter(Boolean).join(' ')||data.country,isp:data.isp,time:new Date().toLocaleString('zh-CN')}, ...history.filter(row => row.ip !== data.ip)].slice(0,15);
  try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch {}
  renderHistory();
}
$('query-form').addEventListener('submit', async event => {
  event.preventDefault();
  active?.abort();
  $('loading').classList.remove('show');
  $('resultCard').classList.remove('show');
  $('errorCard').classList.remove('show');
  const ip = $('ipInput').value.trim();
  if (ip && !validIp(ip)) { showError('请输入有效的 IPv4 或 IPv6 地址。'); return; }
  const request = active = new AbortController();
  const start = performance.now();
  $('loadingText').textContent = ip ? '正在查询 ' + ip + '…' : '正在查询公网 IP…';
  $('loading').classList.add('show');
  try {
    for (const [name, lookup] of providers) {
      try {
        const data = await lookup(ip, request);
        if (!request.signal.aborted) showResult(data, name, Math.round(performance.now() - start));
        return;
      } catch { if (request.signal.aborted) return; }
    }
    showError('查询服务暂不可用，请稍后重试。');
  } finally {
    if (active === request) $('loading').classList.remove('show');
  }
});
$('clearLog').addEventListener('click', () => {
  history = [];
  try { localStorage.removeItem(historyKey); } catch {}
  renderHistory();
});
renderHistory();
</script>
</body>
</html>
